benchmark:
  repetitions: 1
  continue_on_error: true
  timeout_seconds: 900

aut:
  agent: codex
  # Le mancate letture attivano retry e poi caricamento integrale nella stessa sessione.
  skill_protocol: enforced_read_v1
  skill_gate_recovery_policy: recovery_v1
  skill_gate_max_retries: 2
  model: gpt-6.1-terra
  reasoning_effort: low
  version: "0.157.1"
  dns_skill: skills/dns/SKILL.md
  creation_skill: skills/kathara-creation/SKILL.md
  sampling_telemetry:
    enabled: true
    mode: http_trace

sandbox:
  image: python:3.14.6-bookworm

# Docker Sandbox (sbx) backend — abilita isolamento per-run tramite sbx v0.48.0.
# Imposta execution_backend: docker_sandbox per attivarlo.
# Con execution_backend assente o diverso da "docker_sandbox" si usa il backend host (default).
docker_sandbox:
  execution_backend: docker_sandbox  # "docker_sandbox" | assente = host
  sbx_version: "0.48.0"             # versione sbx attesa (corrisponde a EXPECTED_SBX_VERSION)
  codex_version: "0.165.0"          # versione codex nel template sandbox sbx
  auto_start_daemon: true            # avvia sbx daemon se spento (sbx daemon start --detach)
  auto_start_docker: true            # avvia Docker Desktop se spento (open -a Docker su macOS)
  daemon_wait_seconds: 30            # secondi di attesa dopo l'avvio automatico daemon
  docker_wait_seconds: 45            # secondi di attesa dopo l'avvio automatico Docker Desktop
  cleanup_on_error: true             # elimina il sandbox anche in caso di errore (sempre true)
  verify_sandbox_codex: true         # verifica versione e login di Codex dentro il sandbox in preflight

checker:
  no_cache: true
  report_type: csv

results:
  directory: results
