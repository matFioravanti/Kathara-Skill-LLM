test:
  custom_commands:
    c266_client_1:
    - command: |-
        sh -c 'set -eu
        umask 077
        command -v dig >/dev/null
        command -v awk >/dev/null
        command -v xargs >/dev/null
        cat > /tmp/c266_t1_check.sh <<'"'"'C266_T1_SCRIPT'"'"'
        #!/bin/sh
        # COST266 T1 -- automatically injected by the checker into a running client container.
        # Do not ship this script with the student lab: the expected data is ground truth.
        set -u
        Z=/tmp/c266_t1_zones.tsv
        R=/tmp/c266_t1_records.tsv
        PAR=8

        # dig +noall +comments +answer +authority +additional: check actual DNS status,
        # AA/RA flags and the value in the correct section (not merely text matching).
        dig_record() {
            server=$1; q=$2; typ=$3; sec=$4; owner=$5; value=$6; mode=$7
            if [ "$server" = - ]; then
                dig "$q" "$typ" +time=2 +tries=1 +noall +comments +answer +authority +additional 2>/dev/null
            else
                dig "@$server" "$q" "$typ" +norecurse +time=2 +tries=1 +noall +comments +answer +authority +additional 2>/dev/null
            fi | awk -v sec="$sec" -v own="$owner" -v typ="$typ" -v expected="$value" -v mode="$mode" '"'"'
                /status: NOERROR/ {status=1}
                /^;; flags:/ {
                    if (mode=="aa" && / aa[; ]/ && !/ ra[; ]/) f=1
                    if (mode=="ra" && / ra[; ]/) f=1
                }
                /^;; ANSWER SECTION:/ {part="answer";next}
                /^;; AUTHORITY SECTION:/ {part="authority";next}
                /^;; ADDITIONAL SECTION:/ {part="additional";next}
                /^;;/ {next}
                part==sec && $1==own && $4==typ {
                    if (typ=="MX" && $5 "," $6==expected) ok=1
                    if (typ!="MX" && $5==expected) ok=1
                }
                END {exit !(status && f && ok)}'"'"'
        }

        # A DNS negative test also checks status and the SOA identifying negative.test.
        negative() {
            server=$1; mode=$2; q=$3; owner=$4
            if [ "$server" = - ]; then
                dig "$q" A +time=2 +tries=1 +noall +comments +answer +authority 2>/dev/null
            else
                dig "@$server" "$q" A +norecurse +time=2 +tries=1 +noall +comments +answer +authority 2>/dev/null
            fi | awk -v mode="$mode" -v owner="$owner" '"'"'
                /status: NXDOMAIN/ {bad=1}
                /^;; flags:/ {if (mode=="aa" && / aa[; ]/ && !/ ra[; ]/) f=1; if (mode=="ra" && / ra[; ]/) f=1}
                /^;; AUTHORITY SECTION:/ {section="authority";next}
                /^;;/ {next}
                section=="authority" && $1==owner && $4=="SOA" {soa=1}
                END {exit !(bad && f && soa)}'"'"'
        }

        case "${1:-}" in
            __zone)
                z=$2; ip=$3
                if [ "$z" = . ]; then ns=a.root-servers.; else ns=ns1.$z; fi
                dig_record "$ip" "$z" SOA answer "$z" "$ns" aa &&
                dig_record "$ip" "$z" NS answer "$z" "$ns" aa &&
                dig_record "$ip" "$ns" A answer "$ns" "$ip" aa || {
                    echo "FAIL_ZONE $z @$ip" >&2; exit 1;
                }
                echo ok
                ;;
            __deleg)
                z=$2; ip=$3; ns=ns1.$z
                parent=${z#*.}; [ -n "$parent" ] || parent=.
                p_ip=$(awk -v p="$parent" '"'"'$1==p {print $2;exit}'"'"' "$Z")
                [ -n "$p_ip" ] || { echo "NO_PARENT $z" >&2; exit 1; }
                dig "@$p_ip" "__delegation_probe.$z" A +norecurse +time=2 +tries=1 +noall +comments +answer +authority +additional 2>/dev/null | awk -v z="$z" -v ns="$ns" -v ip="$ip" '"'"'
                    /status: NOERROR/ {good=1}
                    /^;; AUTHORITY SECTION:/ {part="authority";next}
                    /^;; ADDITIONAL SECTION:/ {part="additional";next}
                    /^;;/ {next}
                    part=="authority" && $1==z && $4=="NS" && $5==ns {ref=1}
                    part=="additional" && $1==ns && $4=="A" && $5==ip {glue=1}
                    END {exit !(good && ref && glue)}'"'"' || {
                        echo "FAIL_DELEGATION $z parent=$parent parent_ip=$p_ip" >&2; exit 1;
                    }
                echo ok
                ;;
            __record)
                ip=$2; q=$3; typ=$4; expected=$5
                dig_record "$ip" "$q" "$typ" answer "$q" "$expected" aa || {
                    echo "FAIL_AUTH_RECORD $q $typ @$ip" >&2; exit 1;
                }
                echo ok
                ;;
            __client)
                ip=$2; q=$3; typ=$4; expected=$5
                dig_record - "$q" "$typ" answer "$q" "$expected" ra || {
                    echo "FAIL_CLIENT_RECORD $q $typ" >&2; exit 1;
                }
                echo ok
                ;;
            zone|deleg|record|client)
                kind=$1; first=$2; last=$3; shift 3
                case "$kind" in zone|deleg) src=$Z; nargs=2;; *) src=$R; nargs=4;; esac
                if [ "$kind" = deleg ]; then first=$((first+1)); last=$((last+1)); fi
                count=$((last-first+1))
                tmp=$(mktemp -d /tmp/c266_t1.XXXXXXXX) || exit 1
                trap '"'"'rm -rf "$tmp"'"'"' EXIT HUP INT TERM
                # Complete jobs are run in parallel; count one "ok" line for every passed job.
                sed -n "${first},${last}p" "$src" |
                    xargs -P "$PAR" -n "$nargs" sh "$0" "__$kind" > "$tmp/ok" 2> "$tmp/err"
                got=$(wc -l < "$tmp/ok" | tr -d '"'"' '"'"')
                printf '"'"'%s: %s/%s\n'"'"' "$kind" "$got" "$count"
                if [ "$got" -ne "$count" ]; then cat "$tmp/err" >&2; fi
                [ "$got" -eq "$count" ]
                ;;
            negative_auth)
                negative 10.210.18.10 aa missing.negative.test. negative.test. || {
                    echo '"'"'FAIL_NXDOMAIN_AUTHORITATIVE'"'"' >&2; exit 1;
                }
                echo '"'"'NXDOMAIN_AUTH_OK'"'"'
                ;;
            negative_client)
                negative - ra missing.negative.test. negative.test. || {
                    echo '"'"'FAIL_NXDOMAIN_CLIENT'"'"' >&2; exit 1;
                }
                echo '"'"'NXDOMAIN_CLIENT_OK'"'"'
                ;;
            unused_tlds)
                for zone in research. services. lab.; do
                    dig @10.210.0.10 "$zone" NS +norecurse +time=2 +tries=1 +noall +comments +answer +authority 2>/dev/null |
                        awk -v zone="$zone" '"'"'
                          /status: NOERROR|status: NXDOMAIN/ {status=1}
                          /^;; flags:/ {if (/ aa[; ]/ && !/ ra[; ]/) aa=1}
                          $1==zone && $4=="NS" {obsolete=1}
                          END {exit !(status && aa && !obsolete)}'"'"' || {
                            echo "FAIL_OBSOLETE_TLD $zone" >&2; exit 1;
                        }
                done
                echo '"'"'UNUSED_TLDS_OK'"'"'
                ;;
            *) echo "BAD_MODE $1" >&2; exit 2;;
        esac
        C266_T1_SCRIPT
        cat > /tmp/c266_t1_zones.tsv <<'"'"'C266_T1_ZONES'"'"'
        . 10.210.0.10
        europa. 10.210.0.11
