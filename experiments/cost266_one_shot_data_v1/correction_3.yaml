          n = split(spec, groups, ";")
          for (i=1; i<=n; i++) {
            split(groups[i], pair, ":")
            hop = "10.100.0." pair[1]
            m = split(pair[2], refs, ",")
            for (j=1; j<=m; j++) {
              ref = refs[j]
              if (ref ~ /^w[0-9]+$/) dest = "10.100.0." (substr(ref,2)*4) "/30"
              else if (ref ~ /^l[0-9]+$/) dest = "10.200.0." substr(ref,2)
