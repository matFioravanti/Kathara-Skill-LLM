          n = split(spec, groups, ";")
          for (i=1; i<=n; i++) {
            split(groups[i], pair, ":")
            hop = "10.100.0." pair[1]
            m = split(pair[2], refs, ",")
            for (j=1; j<=m; j++) {
              ref = refs[j]
              if (ref ~ /^w[0-9]+$/) dest = "10.100.0." (substr(ref,2)*4) "/30"
              else if (ref ~ /^l[0-9]+$/) dest = "10.200.0." substr(ref,2)
              else { bad++; continue }
              if ((dest in want) && want[dest] != hop) bad++
              want[dest] = hop
            }
          }
        }
        $2 == "via" { have[$1] = $3 }
        END {
          for (dest in want) if (have[dest] != want[dest]) {
            printf "MISSING_ROUTE %s expected=%s actual=%s\n", dest, want[dest], have[dest] > "/dev/stderr"
            bad++
          }
          if (bad) printf "ROUTING_ERRORS %d\n", bad > "/dev/stderr"
          exit (bad > 0)
        }'"'"''
      exit_code: 0
    - command: sh -c 'ip -o -4 addr show dev eth5 | grep -Eq '"'"'inet[[:space:]]+10[.]210[.]26[.][0-9]+/24([[:space:]]|$)'"'"' || { echo '"'"'MISSING_ACCESS_SUBNET
