  applications:
    dns:
      local_ns:
        10.210.34.10: [c266_client_1]
        10.210.36.10: [c266_client_2]
  custom_commands:
    c266_client_1:
      - &install
        command: |
          sh -c 'umask 077
          cat > /tmp/c266-check.sh <<'"'"'C266_SCRIPT'"'"'
          #!/bin/sh
          # Checker injected by the official correction, executed only inside a checker-created lab.
          # All queries have bounded retry/timeout; parallel requests reduce slow-path runtime.
          Z=/tmp/c266-zones.tsv
          R=/tmp/c266-records.tsv
          PAR=12

          dig_check() {
              server=$1; q=$2; typ=$3; section=$4; owner=$5; value=$6; flags=$7
              # The authoritative queries never recurse; client queries use resolv.conf.
              if [ "$server" = '"'"'-'"'"' ]; then
                  dig "$q" "$typ" +time=1 +tries=1 +noall +comments +answer +authority +additional 2>/dev/null
              else
                  dig "@$server" "$q" "$typ" +norecurse +time=1 +tries=1 +noall +comments +answer +authority +additional 2>/dev/null
              fi | awk -v sec="$section" -v owner="$owner" -v typ="$typ" -v val="$value" -v flags="$flags" '"'"'
                /status: NOERROR/ {status=1}
                /^;; flags:/ {if (flags=="aa" && / aa[; ]/) f=1; if (flags=="ra" && / ra[; ]/) f=1; if (flags=="-") f=1}
                /^;; ANSWER SECTION:/ {block="answer";next}
                /^;; AUTHORITY SECTION:/ {block="authority";next}
                /^;; ADDITIONAL SECTION:/ {block="additional";next}
                /^;;/ {next}
                block==sec && $1==owner && $4==typ {
                    if (typ=="MX" && ($5 "," $6)==val) ok=1
                    if (typ!="MX" && $5==val) ok=1
                }
                END {exit !(status && f && ok)}'"'"'
          }

          case "$1" in
           __zone)
              zone=$2; ip=$3
              if [ "$zone" = '"'"'.'"'"' ]; then ns='"'"'a.root-servers.'"'"'; else ns="ns1.$zone"; fi
              dig_check "$ip" "$zone" SOA answer "$zone" "$ns" aa &&
              dig_check "$ip" "$zone" NS answer "$zone" "$ns" aa &&
              dig_check "$ip" "$ns" A answer "$ns" "$ip" aa || exit 1
              echo ok
              ;;
           __deleg)
              zone=$2; ip=$3; ns="ns1.$zone"
              parent=${zone#*.}; [ -n "$parent" ] || parent='"'"'.'"'"'
              parent_ip=$(awk -v p="$parent" '"'"'$1==p {print $2;exit}'"'"' "$Z")
              [ -n "$parent_ip" ] || exit 1
              # A non-existent descendant triggers a referral at the delegation cut.
              out=$(dig "@$parent_ip" "__delegation_probe.$zone" A +norecurse +time=1 +tries=1 +noall +comments +authority +additional 2>/dev/null) || exit 1
              printf '"'"'%s\n'"'"' "$out" | awk -v zone="$zone" -v ns="$ns" -v ip="$ip" '"'"'
                /status: NOERROR/ {status=1}
                /^;; AUTHORITY SECTION:/ {b="auth";next}
                /^;; ADDITIONAL SECTION:/ {b="glue";next}
                /^;;/ {next}
                b=="auth" && $1==zone && $4=="NS" && $5==ns {a=1}
                b=="glue" && $1==ns && $4=="A" && $5==ip {g=1}
                END {exit !(status && a && g)}'"'"' || exit 1
              echo ok
              ;;
           __record)
              ip=$2; q=$3; typ=$4; val=$5
              dig_check "$ip" "$q" "$typ" answer "$q" "$val" aa || exit 1
              echo ok
              ;;
           __client)
              ip=$2; q=$3; typ=$4; val=$5
              dig_check - "$q" "$typ" answer "$q" "$val" ra || exit 1
              echo ok
              ;;
           zone|deleg|record|client)
              mode=$1; start=$2; end=$3
              case "$mode" in zone|deleg) src=$Z; arity=2;; *) src=$R; arity=4;; esac
              count=$((end-start+1))
              # Skip the root entry: the 200 delegations are the 200 remaining zones.
              if [ "$mode" = deleg ]; then start=$((start+1)); end=$((end+1)); fi
              tmp=$(mktemp -d /tmp/c266-check.XXXXXX) || exit 1
              trap '"'"'rm -rf "$tmp"'"'"' EXIT HUP INT TERM
              # xargs -P is available in kathara/base (findutils); every worker prints one '"'"'ok'"'"'.
              sed -n "${start},${end}p" "$src" | xargs -P "$PAR" -n "$arity" sh "$0" "__$mode" > "$tmp/ok" 2> "$tmp/err"
              got=$(wc -l < "$tmp/ok" | tr -d '"'"' '"'"')
              printf '"'"'%s/%s\n'"'"' "$got" "$count"
              [ "$got" -eq "$count" ]
              ;;
           *) echo bad-mode >&2; exit 2;;
          esac
          C266_SCRIPT
          cat > /tmp/c266-zones.tsv <<'"'"'C266_ZONES'"'"'
          . 10.210.0.10
          europa. 10.210.0.11
          infra. 10.210.12.11
          lab. 10.210.26.11
          research. 10.210.12.12
          services. 10.210.28.11
          test. 10.210.18.11
          api.services. 10.210.18.10
          at.europa. 10.210.12.10
          be.europa. 10.210.12.10
          benchmark.lab. 10.210.18.10
          bg.europa. 10.210.12.10
          ch.europa. 10.210.12.10
          checker.lab. 10.210.18.10
          clients.lab. 10.210.18.10
          cz.europa. 10.210.12.10
          datasets.research. 10.210.18.10
          de.europa. 10.210.12.10
          dk.europa. 10.210.12.10
          dns.infra. 10.210.18.10
