# COST266 / multitld_v2 — correction ottimizzata (una sola esecuzione Kathara)
# Basata sulla correction fornita: topologia, IP, 3327 rotte, 201 zone, 200 deleghe,
# 370 record A/MX e 740 risoluzioni client mantenuti.
# 37 loopback /32 verificate nei comandi router (NON in ip_mapping: lo non e un ethN).
# Omitted: 1332 ping full-mesh ridondanti, per ridurre tempi e falsi timeout.
# I test DNS sono raggruppati in 25 batch con xargs -P8 e dig +time=2 +tries=1;
# ogni batch fallisce se almeno una verifica prevista non e superata.
# Richiede sh, awk, dig, xargs -P su kathara/base. Il checker usa exit_code/output.
# I punteggi NON sono comparabili 1:1 con le precedenti correction per granularita.
# Non inserisce file nel lab di origine: script temporaneo nei container del checker.
