# COST266 / T1 — correction ottimizzata (v2).
# 37 router, 57 WAN, 37 loopback, 67 zone e 66 deleghe DNS conservati.
# 10 interfacce access dei router: 10 check separati sulla subnet /24 senza ipotizzare il gateway.
# Routing: stessa matrice di next-hop per ogni destinazione, controlli AWK compattati.
# DNS: 37 righe sorgenti generano i 148 record delle citta; 4 record funzionali invariati.
# La correzione controlla 67 zone, 66 deleghe, 152 record autoritativi e 152 per client.
# I 5 nodi legacy non utilizzati nei test DNS rimangono in topologia per compatibilita.
# Convergence time e parallelismo DNS conservati per minimizzare regressioni.
# PRECONDIZIONE: lab con tutti i dispositivi del lab_inline; lo ZIP base include solo i 37 router.
# Non verificato in esecuzione su un laboratorio Kathara completo (non fornito).
