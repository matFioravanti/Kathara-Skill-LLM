# COST266 — CORRECTION RETE + DNS | 53 dispositivi (37 router + 16 host)
# Revisionata rispetto a correction(9).yaml, senza alterare i test DNS originali.
# Rete: 167 IP verificati (151 backbone + 16 host), 37 forwarding IPv4,
# 3327 rotte statiche di backbone richieste come SOTTOINSIEME (ammette rotte DNS extra),
# 1332 ping effettivamente eseguiti tramite sh -c (37 gruppi).
# DNS: 201 zone SOA/NS/NS-A, 200 deleghe con glue, 370 record A/MX,
# 740 risposte dei due client; verifica local_ns per i due client.
# Nota: i router d'accesso possono avere IP aggiuntivi non dichiarati qui,
# poiché non era disponibile il laboratorio completo con i 16 host.
# I controlli runtime DNS richiedono verifica sul sistema Kathara reale.
# COST266 multi-TLD | optimised reference checker v2
# 37 routers, 16 hosts, 201 zones, 200 delegations, 370 DNS records, 740 client answers.
# Requires GNU/findutils xargs -P, sh, awk, dig, base utilities on kathara/base.
# Custom checks run in parallel inside each client's checker-side container only.
# A group reports X/N and passes iff every required DNS assertion in that group passes.
# This changes checker test granularity compared to the old 2,116-command oracle.
