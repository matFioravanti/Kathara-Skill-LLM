    r_amsterdam:
      - command: |-
          sh -c 'set -eu
          test "$(cat /proc/sys/net/ipv4/ip_forward)" = 1
          ip -o -4 addr show dev lo | grep -Fq 10.200.0.1/32
          ip -4 route show | awk -v spec='"'"'2:w4,w7,w8,w9,w20,w21,w22,w23,w24,w31,w33,w34,w40,w43,w44,w45,w46,w47,w48,w49,w50,w51,w52,w55,l3,l7,l8,l12,l13,l20,l21,l22,l23,l24,l26,l27,l29,l33,l37;6:w29,l14;10:w5,w6,w10,w11,w12,w13,w14,w15,w16,w17,w25,w26,w27,w28,w32,w35,w36,w37,w38,w53,w54,w56,l2,l4,l5,l9,l10,l15,l16,l17,l25,l28,l31,l32,l34,l35,l36;14:w18,w19,w30,w39,w41,w42,l6,l11,l18,l19,l30'"'"' '"'"'BEGIN {
            n = split(spec, groups, ";")
            for (i=1; i<=n; i++) {
              split(groups[i], pair, ":")
              hop = "10.100.0." pair[1]
              m = split(pair[2], refs, ",")
              for (j=1; j<=m; j++) {
                ref = refs[j]
                if (ref ~ /^w[0-9]+$/) dest = "10.100.0." (substr(ref,2)*4) "/30"
                else if (ref ~ /^l[0-9]+$/) dest = "10.200.0." substr(ref,2)
                else { bad++; continue }
                if ((dest in want) && want[dest] != hop) bad++
                want[dest] = hop
              }
            }
          }
          $2 == "via" { have[$1] = $3 }
          END {
            for (dest in want) if (have[dest] != want[dest]) {
              printf "MISSING_ROUTE %s expected=%s actual=%s\n", dest, want[dest], have[dest] > "/dev/stderr"
              bad++
            }
            if (bad) printf "ROUTING_ERRORS %d\n", bad > "/dev/stderr"
            exit (bad > 0)
          }'"'"''
        exit_code: 0
      - command: sh -c 'ip -o -4 addr show dev eth4 | grep -Eq '"'"'inet[[:space:]]+10[.]210[.]0[.][0-9]+/24([[:space:]]|$)'"'"' || { echo '"'"'MISSING_ACCESS_SUBNET r_amsterdam eth4 expected=10.210.0.0/24'"'"' >&2; exit 1; }'
