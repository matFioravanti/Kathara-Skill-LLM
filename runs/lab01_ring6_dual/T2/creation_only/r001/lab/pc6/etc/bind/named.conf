options {
    directory "/var/cache/bind";
    listen-on { none; };
    listen-on-v6 { any; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

zone "test" {
    type secondary;
    file "/var/cache/bind/db.test";
    masters { 2001:db8:1100:1::10; };
    allow-notify { 2001:db8:1100:1::10; };
};
