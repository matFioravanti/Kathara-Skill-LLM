options {
        directory "/var/cache/bind";
        listen-on { any; };
        listen-on-v6 { none; };
        recursion yes;
        allow-query { any; };
        allow-recursion { any; };
        dnssec-validation no;
        empty-zones-enable no;
};

zone "." {
        type hint;
        file "/etc/bind/db.root-hints.internal";
};
