options {
        directory "/var/cache/bind";
        listen-on { any; };
        listen-on-v6 { none; };
        recursion no;
        allow-query { any; };
        dnssec-validation no;
};

zone "test." {
        type master;
        file "/etc/bind/db.test";
        allow-transfer { 10.33.0.138; };
        also-notify { 10.33.0.138; };
};
