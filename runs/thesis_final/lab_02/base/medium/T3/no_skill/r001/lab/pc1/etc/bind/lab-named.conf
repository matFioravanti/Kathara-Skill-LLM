// Lab-only authoritative DNS. Existing routing provides access from every LAN.
options {
    directory "/etc/bind";
    listen-on port 53 { 127.0.0.1; 10.15.1.11; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    pid-file "/run/lab-named.pid";
};
zone "example.com" { type primary; file "/etc/bind/lab-zones/example.com"; };
zone "company.com" { type primary; file "/etc/bind/lab-zones/company.com"; };
zone "service.com" { type primary; file "/etc/bind/lab-zones/service.com"; };
zone "lab.net" { type primary; file "/etc/bind/lab-zones/lab.net"; };
zone "tools.net" { type primary; file "/etc/bind/lab-zones/tools.net"; };
zone "university.edu" { type primary; file "/etc/bind/lab-zones/university.edu"; };
zone "campus.edu" { type primary; file "/etc/bind/lab-zones/campus.edu"; };
zone "unibo.it" { type primary; file "/etc/bind/lab-zones/unibo.it"; };
zone "comune.it" { type primary; file "/etc/bind/lab-zones/comune.it"; };
zone "regione.it" { type primary; file "/etc/bind/lab-zones/regione.it"; };
