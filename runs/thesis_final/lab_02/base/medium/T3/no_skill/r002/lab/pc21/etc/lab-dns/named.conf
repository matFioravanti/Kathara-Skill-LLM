// Lab authoritative zones. Other names use normal recursive resolution.
options {
    directory "/etc/lab-dns";
    listen-on port 53 { 127.0.0.1; 10.15.6.11; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { 127.0.0.1; 10.15.0.0/16; };
    recursion yes;
    dnssec-validation no;
    pid-file "/run/lab-named.pid";
};

zone "example.com" { type master; file "/etc/lab-dns/db.example.com"; };
zone "company.com" { type master; file "/etc/lab-dns/db.company.com"; };
zone "service.com" { type master; file "/etc/lab-dns/db.service.com"; };
zone "lab.net" { type master; file "/etc/lab-dns/db.lab.net"; };
zone "tools.net" { type master; file "/etc/lab-dns/db.tools.net"; };
zone "university.edu" { type master; file "/etc/lab-dns/db.university.edu"; };
zone "campus.edu" { type master; file "/etc/lab-dns/db.campus.edu"; };
zone "unibo.it" { type master; file "/etc/lab-dns/db.unibo.it"; };
zone "comune.it" { type master; file "/etc/lab-dns/db.comune.it"; };
zone "regione.it" { type master; file "/etc/lab-dns/db.regione.it"; };
