options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
};

zone "example.com" { type master; file "/etc/bind/lab/db.example.com"; };
zone "company.com" { type master; file "/etc/bind/lab/db.company.com"; };
zone "service.com" { type master; file "/etc/bind/lab/db.service.com"; };
zone "lab.net" { type master; file "/etc/bind/lab/db.lab.net"; };
zone "tools.net" { type master; file "/etc/bind/lab/db.tools.net"; };
zone "university.edu" { type master; file "/etc/bind/lab/db.university.edu"; };
zone "campus.edu" { type master; file "/etc/bind/lab/db.campus.edu"; };
zone "unibo.it" { type master; file "/etc/bind/lab/db.unibo.it"; };
zone "comune.it" { type master; file "/etc/bind/lab/db.comune.it"; };
zone "regione.it" { type master; file "/etc/bind/lab/db.regione.it"; };
