// Authoritative DNS for laboratory names; no external recursion.
options {
    directory "/etc/bind/lab";
    listen-on port 53 { 127.0.0.1; 10.15.1.11; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    pid-file "/run/named-lab.pid";
};
zone "example.com" { type primary; file "/etc/bind/lab/db.example.com"; };
zone "company.com" { type primary; file "/etc/bind/lab/db.company.com"; };
zone "service.com" { type primary; file "/etc/bind/lab/db.service.com"; };
zone "lab.net" { type primary; file "/etc/bind/lab/db.lab.net"; };
zone "tools.net" { type primary; file "/etc/bind/lab/db.tools.net"; };
zone "university.edu" { type primary; file "/etc/bind/lab/db.university.edu"; };
zone "campus.edu" { type primary; file "/etc/bind/lab/db.campus.edu"; };
zone "unibo.it" { type primary; file "/etc/bind/lab/db.unibo.it"; };
zone "comune.it" { type primary; file "/etc/bind/lab/db.comune.it"; };
zone "regione.it" { type primary; file "/etc/bind/lab/db.regione.it"; };
