options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    allow-recursion { 10.15.0.0/16; 127.0.0.0/8; };
    dnssec-validation no;
    empty-zones-enable no;
};
zone "." { type hint; file "/etc/bind/db.lab-root"; };
