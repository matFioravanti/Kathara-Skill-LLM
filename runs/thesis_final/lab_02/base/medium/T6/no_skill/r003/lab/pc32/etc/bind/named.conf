options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { 10.15.0.0/16; localhost; };
    allow-recursion { 10.15.0.0/16; localhost; };
    allow-query-cache { 10.15.0.0/16; localhost; };
    dnssec-validation no;
    empty-zones-enable no;
};
zone "." { type hint; file "/etc/bind/db.root.lab"; };
