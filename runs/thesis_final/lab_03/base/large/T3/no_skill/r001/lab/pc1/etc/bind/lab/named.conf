options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    allow-recursion { 127.0.0.1; 10.16.0.0/16; 172.26.0.0/16; };
    dnssec-validation auto;
};

zone "campus.edu" { type master; file "/etc/bind/lab/db.campus.edu"; };
zone "company.com" { type master; file "/etc/bind/lab/db.company.com"; };
zone "comune.it" { type master; file "/etc/bind/lab/db.comune.it"; };
