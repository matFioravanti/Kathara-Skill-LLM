options {
    directory "/shared/dns";
    pid-file "/run/lab-named.pid";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { 10.16.0.0/16; localhost; };
    recursion yes;
    dnssec-validation auto;
};
zone "ministero.gov" { type master; file "/shared/dns/db.ministero.gov"; };
zone "example.com" { type master; file "/shared/dns/db.example.com"; };
zone "lab.net" { type master; file "/shared/dns/db.lab.net"; };
