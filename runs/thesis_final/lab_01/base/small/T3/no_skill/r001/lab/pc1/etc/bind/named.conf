options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};
zone "example.com" { type master; file "/etc/bind/zones/example.com"; };
zone "service.com" { type master; file "/etc/bind/zones/service.com"; };
zone "lab.net" { type master; file "/etc/bind/zones/lab.net"; };
zone "tools.net" { type master; file "/etc/bind/zones/tools.net"; };
