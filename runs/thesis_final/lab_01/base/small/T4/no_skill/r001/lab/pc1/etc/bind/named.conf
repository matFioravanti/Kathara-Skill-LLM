options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
};
zone "example.com" { type master; file "/etc/bind/zones/db.example.com"; };
zone "service.com" { type master; file "/etc/bind/zones/db.service.com"; };
zone "lab.net" { type master; file "/etc/bind/zones/db.lab.net"; };
zone "tools.net" { type master; file "/etc/bind/zones/db.tools.net"; };
