options {
        directory "/var/cache/bind";
        listen-on { any; };
        listen-on-v6 { any; };
        recursion no;
        dnssec-validation no;
};

zone "test." {
        type master;
        file "/etc/bind/db.test";
        allow-transfer { 2001:db8:1200:4::10; };
        notify yes;
};
