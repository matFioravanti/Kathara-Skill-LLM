# Lab 01 - Catena lineare: quattro router, quattro LAN, venti PC.
# Nomenclatura ispirata al lab allegato: A1..A4 (LAN), B12/B23/B34 (router-router).
# IPv4-only, routing statico; nessun servizio DNS configurato.
