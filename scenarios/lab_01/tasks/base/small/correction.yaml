  # --- Controlli applicativi ---
  # Raggruppa le aspettative relative al servizio DNS.
  applications:
    # Il checker usa le mappature seguenti per controllare server, resolver e record DNS.
    dns:
      # --- Server autorevoli ---
      # Associa ogni zona al relativo indirizzo del server autorevole atteso; . indica la radice DNS.
      authoritative:
        .:
        - 10.14.1.11
        com:
        - 10.14.1.12
        net:
        - 10.14.1.13
        example.com:
        - 10.14.1.14
        service.com:
        - 10.14.2.11
        lab.net:
        - 10.14.2.12
        tools.net:
        - 10.14.2.13
        shop.example.com:
        - 10.14.3.11
        api.service.com:
        - 10.14.3.12
        research.lab.net:
        - 10.14.3.13
        ci.tools.net:
        - 10.14.4.11
        ai.research.lab.net:
        - 10.14.4.12
        data.research.lab.net:
        - 10.14.4.13
      # --- Resolver locale e client ---
      # Associa il resolver 10.14.4.14 (pc14) ai client pc16-pc20 che devono utilizzarlo.
      local_ns:
        10.14.4.14:
        - pc16
        - pc17
        - pc18
        - pc19
        - pc20
      # --- Record DNS attesi ---
      # Specifica i valori delle risposte DNS da verificare per i nomi indicati.
      records:
        # Record A: associano ciascun nome all’indirizzo IPv4 riportato.
        A:
          shop.example.com:
          - 10.14.3.11
          api.service.com:
          - 10.14.3.12
          ci.tools.net:
          - 10.14.4.11
          ai.research.lab.net:
          - 10.14.4.12
          data.research.lab.net:
          - 10.14.4.13
          mail.example.com:
          - 10.14.1.14
          mail.service.com:
          - 10.14.2.11
          mail.lab.net:
          - 10.14.2.12
          mail.tools.net:
          - 10.14.2.13
        # Record MX: indicano priorità 10 e nome del server di posta atteso.
        MX:
          example.com:
          - 10 mail.example.com.
          service.com:
          - 10 mail.service.com.
          lab.net:
          - 10 mail.lab.net.
          tools.net:
          - 10 mail.tools.net.
