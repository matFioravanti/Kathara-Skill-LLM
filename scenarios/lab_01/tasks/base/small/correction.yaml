  # Usa pgrep per controllare la presenza dei processi; ! richiede che siano assenti.
  # named deve essere presente sui server DNS pc1-pc14; il prefisso ! indica assenza richiesta.
  # Sui router sono inoltre vietati i demoni di routing dinamico elencati.
