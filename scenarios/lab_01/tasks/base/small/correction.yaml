# Oracolo RETE+DNS da 01_technical_structured_small(3).md: 13 zone, 12 deleghe, 4 MX.
# ATTENZIONE: questa correction deve fallire sulla baseline DNS-free; applicare DOPO l'agente.
# --- CS01 — Presenza dei dispositivi ---
# Verifica che tutti i dispositivi del modello lab_inline esistano nel laboratorio valutato.
# --- CS02 — Collegamenti e domini di collisione ---
# Confronta il dominio di collisione di ogni interfaccia con quello del modello lab_inline.
# Definisce le interfacce attese e i rispettivi domini di collisione.
# A1-A6 sono LAN di accesso; B12, B23 e B34 collegano i router.
lab_inline: 'r1[0]="A1"

  r1[1]="A2"

  r1[2]="B12"

  r2[0]="A3"

  r2[1]="B12"

  r2[2]="B23"

  r3[0]="A4"

  r3[1]="A5"

  r3[2]="B23"

  r3[3]="B34"

  r4[0]="A6"

  r4[1]="B34"

  pc1[0]="A1"

  pc2[0]="A1"

  pc3[0]="A1"

  pc4[0]="A1"

  pc5[0]="A2"

  pc6[0]="A2"

  pc7[0]="A2"

  pc8[0]="A3"

  pc9[0]="A3"

  pc10[0]="A3"

  pc11[0]="A4"

  pc12[0]="A4"

  pc13[0]="A4"

  pc14[0]="A4"

  pc15[0]="A5"

  pc16[0]="A5"

  pc17[0]="A5"

  pc18[0]="A6"

  pc19[0]="A6"

  pc20[0]="A6"

  '
# --- Avvio e convergenza ---
# Tempo di attesa impostato a 60 secondi prima dei controlli.
convergence_time: 60
# Immagine Kathara predefinita indicata per la valutazione.
default_image: kathara/base
test:
  # --- CS03 — Presenza degli script di avvio ---
  # Verifica l’esistenza dei file .startup richiesti, non la correttezza del loro contenuto.
  # Elenca i router e i PC per i quali è richiesto uno script di startup.
  requiring_startup:
  - r1
  - r2
  - r3
  - r4
  - pc1
  - pc2
  - pc3
  - pc4
  - pc5
  - pc6
  - pc7
  - pc8
  - pc9
  - pc10
  - pc11
  - pc12
  - pc13
  - pc14
  - pc15
  - pc16
  - pc17
  - pc18
  - pc19
  - pc20
