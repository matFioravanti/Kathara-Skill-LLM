# SMALL T1 - Custom DNS v2, complementari alla correction originale.
# Fonte: 01_technical_structured_small.md + correction(4).yaml.
# Skill di riferimento: kathara-dns / dns-v2 (repo Kathara-Skill-LLM).
# lab_inline richiesto per esecuzione autonoma; i controlli nativi del checker possono comunque essere presenti nel report.
# Non modifica il lab. Nessun nome NS, TTL o percorso file di zona imposto.
# Non prova assenza di forwarder, root hints o DNSSEC. Non impone HTTP/SMTP/AAAA/PTR/CNAME.
# Invarianza di rete: confrontare baseline e AUT separatamente; non inclusa in questi custom DNS.
# TCP e separazione ruoli sono controlli funzionali aggiuntivi, non prova globale delle ACL.
# Runtime non eseguito: validare su baseline DNS-free e lab corretto prima del benchmark.
# 62 custom: 48 funzionali + 14 diagnostici BIND.
