      exit_code: 0
    pc3dual:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:3::30/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show default | grep -Fq 'default via fd00:3::1 dev eth0'"
