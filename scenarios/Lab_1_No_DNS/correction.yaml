    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
  # IPv6 secondary addresses, IPv6 static/default routes and router forwarding. Commands
  # containing pipes are explicitly wrapped in `sh -c`.
  custom_commands:
    r1:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:1::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth1 | grep -Fq 'inet6 fd00:ff:12::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth2 | grep -Fq 'inet6 fd00:ff:51::2/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:2::/64 | grep -Fq 'fd00:2::/64 via fd00:ff:12::2 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:3::/64 | grep -Fq 'fd00:3::/64 via fd00:ff:12::2 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:4::/64 | grep -Fq 'fd00:4::/64 via fd00:ff:51::1 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:5::/64 | grep -Fq 'fd00:5::/64 via fd00:ff:51::1 dev eth2'"
      exit_code: 0
    - command: sysctl -n net.ipv4.ip_forward
      regex_match: ^1\s*$
    - command: sysctl -n net.ipv6.conf.all.forwarding
      regex_match: ^1\s*$
    r2:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:2::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth1 | grep -Fq 'inet6 fd00:ff:12::2/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth2 | grep -Fq 'inet6 fd00:ff:23::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:1::/64 | grep -Fq 'fd00:1::/64 via fd00:ff:12::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:3::/64 | grep -Fq 'fd00:3::/64 via fd00:ff:23::2 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:4::/64 | grep -Fq 'fd00:4::/64 via fd00:ff:23::2 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:5::/64 | grep -Fq 'fd00:5::/64 via fd00:ff:12::1 dev eth1'"
      exit_code: 0
    - command: sysctl -n net.ipv4.ip_forward
      regex_match: ^1\s*$
    - command: sysctl -n net.ipv6.conf.all.forwarding
      regex_match: ^1\s*$
    r3:
