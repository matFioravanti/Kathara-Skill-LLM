    - command: sh -c "ip -6 route show fd00:3::/64 | grep -Fq 'fd00:3::/64 via fd00:ff:45::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:4::/64 | grep -Fq 'fd00:4::/64 via fd00:ff:45::1 dev eth1'"
      exit_code: 0
    - command: sysctl -n net.ipv4.ip_forward
      regex_match: ^1\s*$
    - command: sysctl -n net.ipv6.conf.all.forwarding
      regex_match: ^1\s*$
    pc1v6:
    - command: sh -c "ip -6 route show default | grep -Fq 'default via fd00:1::1 dev eth0'"
      exit_code: 0
    pc1dual:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:1::30/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show default | grep -Fq 'default via fd00:1::1 dev eth0'"
      exit_code: 0
    pc2v6:
    - command: sh -c "ip -6 route show default | grep -Fq 'default via fd00:2::1 dev eth0'"
      exit_code: 0
    pc2dual:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:2::30/64'"
