      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth1 | grep -Fq 'inet6 fd00:ff:23::2/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth2 | grep -Fq 'inet6 fd00:ff:34::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:1::/64 | grep -Fq 'fd00:1::/64 via fd00:ff:23::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:2::/64 | grep -Fq 'fd00:2::/64 via fd00:ff:23::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:4::/64 | grep -Fq 'fd00:4::/64 via fd00:ff:34::2 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:5::/64 | grep -Fq 'fd00:5::/64 via fd00:ff:34::2 dev eth2'"
      exit_code: 0
    - command: sysctl -n net.ipv4.ip_forward
      regex_match: ^1\s*$
    - command: sysctl -n net.ipv6.conf.all.forwarding
      regex_match: ^1\s*$
    r4:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:4::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth1 | grep -Fq 'inet6 fd00:ff:34::2/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth2 | grep -Fq 'inet6 fd00:ff:45::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:1::/64 | grep -Fq 'fd00:1::/64 via fd00:ff:45::2 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:2::/64 | grep -Fq 'fd00:2::/64 via fd00:ff:34::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:3::/64 | grep -Fq 'fd00:3::/64 via fd00:ff:34::1 dev eth1'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:5::/64 | grep -Fq 'fd00:5::/64 via fd00:ff:45::2 dev eth2'"
      exit_code: 0
    - command: sysctl -n net.ipv4.ip_forward
      regex_match: ^1\s*$
    - command: sysctl -n net.ipv6.conf.all.forwarding
      regex_match: ^1\s*$
    r5:
    - command: sh -c "ip -6 -o addr show dev eth0 | grep -Fq 'inet6 fd00:5::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth1 | grep -Fq 'inet6 fd00:ff:45::2/64'"
      exit_code: 0
    - command: sh -c "ip -6 -o addr show dev eth2 | grep -Fq 'inet6 fd00:ff:51::1/64'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:1::/64 | grep -Fq 'fd00:1::/64 via fd00:ff:51::2 dev eth2'"
      exit_code: 0
    - command: sh -c "ip -6 route show fd00:2::/64 | grep -Fq 'fd00:2::/64 via fd00:ff:51::2 dev eth2'"
