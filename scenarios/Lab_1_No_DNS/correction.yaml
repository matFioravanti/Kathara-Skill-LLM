# correction.yaml — static-routing-5routers
# Derived only from the supplied lab.conf and .startup files.
# Static routing only: no dynamic-protocol convergence is needed.
# lab_inline contains topology mappings only, as required by the schema.
lab_inline: |
  r1[0]="LAN1"
  r1[1]="R12"
  r1[2]="R51"
  r2[0]="LAN2"
  r2[1]="R12"
  r2[2]="R23"
  r3[0]="LAN3"
  r3[1]="R23"
  r3[2]="R34"
  r4[0]="LAN4"
  r4[1]="R34"
  r4[2]="R45"
  r5[0]="LAN5"
  r5[1]="R45"
  r5[2]="R51"
  pc1v4[0]="LAN1"
  pc1v6[0]="LAN1"
  pc1dual[0]="LAN1"
  pc2v4[0]="LAN2"
  pc2v6[0]="LAN2"
  pc2dual[0]="LAN2"
  pc3v4[0]="LAN3"
  pc3v6[0]="LAN3"
  pc3dual[0]="LAN3"
  pc4v4[0]="LAN4"
  pc4v6[0]="LAN4"
  pc4dual[0]="LAN4"
  pc5v4[0]="LAN5"
  pc5v6[0]="LAN5"
  pc5dual[0]="LAN5"

convergence_time: 10
default_image: kathara/core
test:
  requiring_startup:
  - r1
  - r2
  - r3
  - r4
  - r5
  - pc1v4
  - pc1v6
  - pc1dual
  - pc2v4
  - pc2v6
  - pc2dual
  - pc3v4
  - pc3v6
  - pc3dual
  - pc4v4
  - pc4v6
  - pc4dual
  - pc5v4
  - pc5v6
  - pc5dual
  # One primary IP per interface is checked here; IPv6 secondary addresses on dual-stack
  # interfaces are checked below with custom_commands.
  ip_mapping:
    r1:
      '0': 10.1.0.1/24
      '1': 10.255.12.1/30
      '2': 10.255.51.2/30
    r2:
      '0': 10.2.0.1/24
      '1': 10.255.12.2/30
      '2': 10.255.23.1/30
    r3:
      '0': 10.3.0.1/24
      '1': 10.255.23.2/30
      '2': 10.255.34.1/30
    r4:
      '0': 10.4.0.1/24
      '1': 10.255.34.2/30
      '2': 10.255.45.1/30
    r5:
      '0': 10.5.0.1/24
      '1': 10.255.45.2/30
      '2': 10.255.51.1/30
    pc1v4:
      '0': 10.1.0.10/24
    pc1v6:
      '0': fd00:1::20/64
    pc1dual:
      '0': 10.1.0.30/24
    pc2v4:
      '0': 10.2.0.10/24
    pc2v6:
      '0': fd00:2::20/64
    pc2dual:
      '0': 10.2.0.30/24
    pc3v4:
      '0': 10.3.0.10/24
    pc3v6:
      '0': fd00:3::20/64
    pc3dual:
      '0': 10.3.0.30/24
    pc4v4:
      '0': 10.4.0.10/24
    pc4v6:
      '0': fd00:4::20/64
    pc4dual:
      '0': 10.4.0.30/24
    pc5v4:
      '0': 10.5.0.10/24
    pc5v6:
      '0': fd00:5::20/64
    pc5dual:
      '0': 10.5.0.30/24
  daemons:
    r1:
    - '!bgpd'
    - '!ripd'
    - '!ospfd'
    - '!ospf6d'
    - '!zebra'
    - '!watchfrr'
    - '!named'
    r2:
    - '!bgpd'
    - '!ripd'
    - '!ospfd'
    - '!ospf6d'
    - '!zebra'
    - '!watchfrr'
    - '!named'
    r3:
    - '!bgpd'
    - '!ripd'
    - '!ospfd'
    - '!ospf6d'
    - '!zebra'
    - '!watchfrr'
    - '!named'
    r4:
    - '!bgpd'
    - '!ripd'
    - '!ospfd'
    - '!ospf6d'
    - '!zebra'
    - '!watchfrr'
    - '!named'
    r5:
    - '!bgpd'
    - '!ripd'
    - '!ospfd'
    - '!ospf6d'
    - '!zebra'
    - '!watchfrr'
    - '!named'
    pc1v4:
    - '!named'
    pc1v6:
    - '!named'
    pc1dual:
    - '!named'
    pc2v4:
    - '!named'
    pc2v6:
    - '!named'
    pc2dual:
    - named
    pc3v4:
    - '!named'
    pc3v6:
    - '!named'
    pc3dual:
    - named
    pc4v4:
    - '!named'
    pc4v6:
    - '!named'
    pc4dual:
    - '!named'
    pc5v4:
    - '!named'
    pc5v6:
    - '!named'
    pc5dual:
    - named
  # Only explicitly installed IPv4 static/default routes are listed here; directly connected
  # subnets are intentionally excluded. IPv6 routes are checked with `ip -6 route`.
  kernel_routes:
    r1:
    - - 10.2.0.0/24
      - - 10.255.12.2
        - eth1
    - - 10.3.0.0/24
      - - 10.255.12.2
        - eth1
    - - 10.4.0.0/24
      - - 10.255.51.1
        - eth2
    - - 10.5.0.0/24
      - - 10.255.51.1
        - eth2
    r2:
    - - 10.1.0.0/24
      - - 10.255.12.1
        - eth1
    - - 10.3.0.0/24
      - - 10.255.23.2
        - eth2
    - - 10.4.0.0/24
      - - 10.255.23.2
        - eth2
    - - 10.5.0.0/24
      - - 10.255.12.1
        - eth1
    r3:
    - - 10.1.0.0/24
      - - 10.255.23.1
        - eth1
    - - 10.2.0.0/24
      - - 10.255.23.1
        - eth1
    - - 10.4.0.0/24
      - - 10.255.34.2
        - eth2
    - - 10.5.0.0/24
      - - 10.255.34.2
        - eth2
    r4:
    - - 10.1.0.0/24
      - - 10.255.45.2
        - eth2
    - - 10.2.0.0/24
      - - 10.255.34.1
        - eth1
    - - 10.3.0.0/24
      - - 10.255.34.1
        - eth1
    - - 10.5.0.0/24
      - - 10.255.45.2
        - eth2
    r5:
    - - 10.1.0.0/24
      - - 10.255.51.2
        - eth2
    - - 10.2.0.0/24
      - - 10.255.51.2
        - eth2
    - - 10.3.0.0/24
      - - 10.255.45.1
        - eth1
    - - 10.4.0.0/24
      - - 10.255.45.1
        - eth1
    pc1v4:
    - - 0.0.0.0/0
      - - 10.1.0.1
        - eth0
    pc1dual:
    - - 0.0.0.0/0
      - - 10.1.0.1
        - eth0
    pc2v4:
    - - 0.0.0.0/0
      - - 10.2.0.1
        - eth0
    pc2dual:
    - - 0.0.0.0/0
      - - 10.2.0.1
        - eth0
    pc3v4:
    - - 0.0.0.0/0
      - - 10.3.0.1
        - eth0
    pc3dual:
    - - 0.0.0.0/0
      - - 10.3.0.1
        - eth0
    pc4v4:
    - - 0.0.0.0/0
      - - 10.4.0.1
        - eth0
    pc4dual:
    - - 0.0.0.0/0
      - - 10.4.0.1
        - eth0
    pc5v4:
    - - 0.0.0.0/0
      - - 10.5.0.1
        - eth0
    pc5dual:
    - - 0.0.0.0/0
      - - 10.5.0.1
        - eth0
  # The base lab exposes resolver assignments but no authoritative zones/records, so only
  # local_ns is asserted and no DNS data is invented.
  applications:
    dns:
      local_ns:
        10.3.0.30:
        - pc1v4
        - pc1dual
        - pc2v4
        - pc3v4
        - pc4v4
        - pc4dual
        - pc5v4
        fd00:3::30:
        - pc1v6
        - pc1dual
        - pc2v6
        - pc3v6
        - pc4v6
        - pc4dual
        - pc5v6
  # Family-aware end-to-end reachability: one host endpoint per LAN for each supported family.
  reachability:
    r1:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    r2:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    - fd00:1::20
