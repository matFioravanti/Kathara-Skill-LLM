    - 10.5.0.10
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    pc1v4:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    pc1v6:
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    pc1dual:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    pc2v4:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    pc2v6:
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    pc2dual:
    - 10.1.0.10
    - 10.2.0.10
    - 10.3.0.10
    - 10.4.0.10
    - 10.5.0.10
    - fd00:1::20
    - fd00:2::20
    - fd00:3::20
    - fd00:4::20
    - fd00:5::20
    pc3v4:
    - 10.1.0.10
