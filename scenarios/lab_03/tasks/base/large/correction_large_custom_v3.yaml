# LARGE T1 - Custom DNS v3, adattamento della V3 Medium fornita.
# Fonti: 03_technical_structured_large(4).md, lab base Large (lab_06), correction_medium_custom_v3(1).yaml.
# Skill: kathara-dns / kathara-lab-checker; schema di correction del progetto.
# 49 zone, 48 deleghe, pc50 resolver, pc51-pc60 client.
# 272 custom funzionali; diagnostica BIND esclusa.
# Record A: tutti i 48 apici non-root (inclusi gli 8 TLD), www.example.com e 4 mail, come interpretazione di tutti i nomi della gerarchia.
# Non impone nomi NS, TTL o percorsi di configurazione.
# Non prova direttamente root hints, assenza forwarder, DNSSEC o invarianza della rete.
# Esclusivita limitata alle 49 zone note: 48 query negative per autoritativo, fino a 2352 query totali.
# A ricorsivi: www da tutti i client, ai.research.lab.net via TCP da pc51, altri 51 A e 4 MX da pc51 tramite resolver configurato.
# Convergenza: 25 s come V3 Medium; da validare sul Large.
# Runtime NOT_RUN: validare su baseline DNS-free, lab corretto e mutanti.
