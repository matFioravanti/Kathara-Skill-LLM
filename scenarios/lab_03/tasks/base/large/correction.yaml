    - command: 'sh -c ''out=$(dig @10.16.12.13 servizi.ministero.gov. MX +norecurse +time=5 +tries=1 +noall +comments +answer);
        printf "%s\n" "$out" | grep -q "status: NOERROR" && printf "%s\n" "$out" | grep -Eq "flags:[^;]*[[:space:]]aa([;[:space:]]|$)"
        && printf "%s\n" "$out" | awk ''"''"''tolower($1)=="servizi.ministero.gov." && $4=="MX" && $5=="10" && tolower($6)=="mail.servizi.ministero.gov."
        {found=1} END {exit !found}''"''"'''''
      exit_code: 0
