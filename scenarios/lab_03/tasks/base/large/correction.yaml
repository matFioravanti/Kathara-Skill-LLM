        "%s\n" "$out" | grep -q "status: NOERROR" && printf "%s\n" "$out" | grep -Eq "flags:[^;]*[[:space:]]aa([;[:space:]]|$)"
        && printf "%s\n" "$out" | awk ''"''"''tolower($1)=="university.edu." && $4=="MX" && $5=="10" && tolower($6)=="mail.university.edu."
        {found=1} END {exit !found}''"''"'''''
      exit_code: 0
    # Interroga senza ricorsione 10.16.5.12 per l’MX di dept.company.com..
    # Richiede NOERROR, AA e un MX con priorità 10 verso mail.dept.company.com.; non prova la posta.
    - command: 'sh -c ''out=$(dig @10.16.5.12 dept.company.com. MX +norecurse +time=5 +tries=1 +noall +comments +answer);
