  # --- Custom command ---
  # Ogni comando viene eseguito sul dispositivo indicato; exit_code 0 indica verifica riuscita.
  custom_commands:
    pc50:
    # --- CC01 — Autorità delle zone: controlli SOA (pc50) ---
    # Interroga senza ricorsione 10.16.1.11 da pc50 per il SOA di ..
    # Verifica NOERROR, il flag AA e la presenza del SOA per la zona.
    - command: 'sh -c ''out=$(dig @10.16.1.11 . SOA +norecurse +time=5 +tries=1 +noall +comments +answer); printf "%s\n" "$out"
        | grep -q "status: NOERROR" && printf "%s\n" "$out" | grep -Eq "flags:[^;]*[[:space:]]aa([;[:space:]]|$)" && printf
        "%s\n" "$out" | awk ''"''"''tolower($1)=="." && $4=="SOA" {found=1} END {exit !found}''"''"'''''
      exit_code: 0
