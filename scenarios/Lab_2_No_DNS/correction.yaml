# correction.yaml — lab static-routing IPv4/IPv6 + gerarchia DNS interna
# Topologia, indirizzi, gateway, routing e reachability di base restano invariati.
# DNS: pc2=root IPv4, pc8=authoritative test IPv6, pc3=resolver dual-stack,
# client pc4 IPv4 e pc6 IPv6; web server IPv6 su pc9.
# Le verifiche DNS specifiche sono eseguite anche con dig/custom_commands.

