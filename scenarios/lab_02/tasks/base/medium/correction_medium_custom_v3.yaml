# MEDIUM - Custom DNS v3, adattamento della V3 Small fornita.
# Fonte: 02_technical_structured_medium(4).md + correction generale Medium.
# Skill di riferimento: kathara-dns / kathara-lab-checker.
# 31 zone, 30 deleghe, pc32 resolver, pc33-pc40 client.
# 144 custom funzionali; diagnostica BIND esclusa.
# Non impone nomi NS, TTL o percorsi di configurazione.
# Non prova direttamente root hints, assenza forwarder, DNSSEC o invarianza della rete.
# Esclusivita limitata alle 31 zone note; 30 query negative per autoritativo.
# A ricorsivi: www da tutti i client, ai.research.lab.net via TCP da pc33,
# gli altri 17 A e i 2 MX dal client pc33 tramite il resolver configurato.
# Runtime NOT_RUN: validare su baseline DNS-free e lab corretto.
