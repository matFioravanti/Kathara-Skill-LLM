  # --- Controlli applicativi ---
  # Raggruppa le aspettative relative al servizio DNS.
  applications:
    # Il checker usa le mappature seguenti per controllare server, resolver e record DNS.
    dns:
      # --- CS08 — Server DNS autorevoli attesi ---
      # Interroga gli NS e risolve i loro nomi per cercare l’IP autorevole atteso.
      # Per la radice controlla anche il resolver locale; non richiede esplicitamente il flag AA.
      # Associa ogni zona all’indirizzo del server autorevole atteso; . indica la radice DNS.
      authoritative:
        .:
        - 10.15.1.11
        com:
        - 10.15.1.12
        net:
        - 10.15.1.13
        edu:
        - 10.15.1.14
        it:
        - 10.15.2.11
        example.com:
        - 10.15.2.12
        company.com:
        - 10.15.2.13
        service.com:
        - 10.15.2.14
        lab.net:
        - 10.15.3.11
        tools.net:
        - 10.15.3.12
        university.edu:
        - 10.15.3.13
        campus.edu:
        - 10.15.3.14
        unibo.it:
        - 10.15.4.11
        comune.it:
        - 10.15.4.12
        regione.it:
        - 10.15.4.13
        shop.example.com:
        - 10.15.4.14
        blog.example.com:
        - 10.15.5.11
        dept.company.com:
        - 10.15.5.12
        intranet.company.com:
        - 10.15.5.13
        api.service.com:
        - 10.15.5.14
        research.lab.net:
        - 10.15.6.11
        ai.research.lab.net:
        - 10.15.6.12
        data.research.lab.net:
        - 10.15.6.13
        dev.lab.net:
        - 10.15.6.14
        ci.tools.net:
        - 10.15.7.11
        vpn.university.edu:
        - 10.15.7.12
        courses.university.edu:
        - 10.15.7.13
        portal.campus.edu:
        - 10.15.7.14
        studenti.unibo.it:
        - 10.15.8.11
        servizi.comune.it:
        - 10.15.8.12
        dati.regione.it:
        - 10.15.8.13
      # --- CS09 — Resolver DNS configurato sui client ---
      # Cerca il nameserver atteso in /etc/resolv.conf dei client; non ne verifica da solo il funzionamento.
      # Associa il resolver 10.15.8.14 (pc32) ai client pc33-pc40.
      local_ns:
        10.15.8.14:
        - pc33
        - pc34
        - pc35
        - pc36
        - pc37
        - pc38
        - pc39
        - pc40
      # --- Record DNS attesi ---
      # Specifica i valori delle risposte DNS da verificare per i nomi indicati.
      records:
        # Record A: associano i nomi agli indirizzi IPv4 riportati.
        # --- CS10 — Risoluzione dei record A dai client ---
        # Esegue dig +short A sui client di local_ns e confronta l’output con i valori attesi.
        # Verifica la risoluzione dal client senza richiedere esplicitamente il flag AA.
        A:
          # Servizio web example.com su pc6, IP 10.15.2.12.
          www.example.com:
          - 10.15.2.12
          shop.example.com:
          - 10.15.4.14
          blog.example.com:
          - 10.15.5.11
          dept.company.com:
          - 10.15.5.12
          intranet.company.com:
          - 10.15.5.13
          api.service.com:
          - 10.15.5.14
          research.lab.net:
          - 10.15.6.11
          ai.research.lab.net:
          - 10.15.6.12
          data.research.lab.net:
          - 10.15.6.13
          dev.lab.net:
          - 10.15.6.14
          ci.tools.net:
          - 10.15.7.11
          vpn.university.edu:
