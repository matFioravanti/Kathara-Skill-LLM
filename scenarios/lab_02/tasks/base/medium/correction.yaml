          courses.university.edu:
          - 10.15.7.13
          portal.campus.edu:
          - 10.15.7.14
          studenti.unibo.it:
          - 10.15.8.11
          servizi.comune.it:
          - 10.15.8.12
          dati.regione.it:
          - 10.15.8.13
          mail.company.com:
          - 10.15.2.13
          mail.university.edu:
          - 10.15.3.13
        # Record MX: indicano priorità 10 e nome del server di posta atteso.
        # --- CS11 — Risoluzione dei record MX dai client ---
        # Esegue dig +short MX sui client e confronta preferenza e destinazione attese.
        # Controlla i dati DNS, non l’invio o la ricezione della posta via SMTP.
        MX:
          company.com:
          - 10 mail.company.com.
          university.edu:
          - 10 mail.university.edu.
